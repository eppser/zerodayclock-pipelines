name: Observation pipeline

# Exploitation OBSERVATIONS — a separate pipeline from KEV, writing to the obs_* schemas.
#
# Same clock discipline as the KEV pipeline: GitHub cron is UTC-only with no DST
# awareness, so we fire on both candidate hours and let a guard check the real
# Europe/Berlin time. Offset 30 minutes past the hour so the two pipelines do not
# contend for the database.

on:
  schedule:
    - cron: '30 4,5,16,17 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'incremental (recent months + deltas) or full (MSRC 2016->now backfill)'
        type: choice
        options: [incremental, full]
        default: incremental
      environment:
        type: choice
        options: [staging, production]
        default: staging
      sources:
        description: 'Comma-separated subset (blank = all enabled)'
        type: string
        default: ''

concurrency:
  group: obs-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Tests run in their own job with no environment, so neither the test tooling nor
  # anything it installs can reach the database credentials.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Install
        run: pip install --only-binary ':all:' --require-hashes -r requirements-ci.txt
      - name: Unit tests
        run: python -m pytest -q

  ingest:
    needs: test
    runs-on: ubuntu-latest
    # A full MSRC backfill is ~130 documents and took 4m40s locally; allow headroom.
    timeout-minutes: 45
    environment: ${{ github.event.inputs.environment || 'staging' }}
    defaults:
      run:
        working-directory: pipeline

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # THE GUARD USED TO BE ITS OWN JOB. It always returns should_run=true — the
      # Berlin-hour gate was removed after it dropped 20 of 21 scheduled runs — so all
      # it still did was compute `mode`, in three seconds, in a job that costs a FULL
      # BILLED MINUTE. The block below is the guard's, moved and otherwise unchanged.
      - id: clock
        name: Decide the run mode
        working-directory: .
        env:
          INPUT_MODE: ${{ github.event.inputs.mode }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            case "${INPUT_MODE:-incremental}" in incremental|full) ;; *) echo "invalid mode"; exit 1;; esac
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "mode=${INPUT_MODE:-incremental}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          HOUR=$(TZ=Europe/Berlin date +%H)
          DOW=$(TZ=Europe/Berlin date +%u)
          # NO EXACT-HOUR TEST. This used to require a specific Europe/Berlin hour, which
          # assumes cron fires on the hour. GitHub delays scheduled workflows on private
          # repos by hours: measured 2026-08-28..08-31, only 1 of 21 scheduled runs across
          # these four workflows reached its ingest step. The other 20 reported SUCCESS
          # with the job skipped — a dead collector behind a green tick, the exact v1
          # failure this project exists to avoid. Whatever hour the cron lands on, run.
          if [ "$HOUR" -lt 12 ]; then SLOT=am; else SLOT=pm; fi
          echo "Berlin hour $HOUR — running ($SLOT slot)."
          echo "should_run=true" >> "$GITHUB_OUTPUT"
          # Weekly full sweep re-reads every MSRC month back to 2016. Microsoft revises
          # documents in place and a CVE can gain Exploited:Yes long after publication,
          # so only a full pass finds those late flips.
          if [ "$DOW" = "7" ] && [ "$SLOT" = "am" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
          else
            echo "mode=incremental" >> "$GITHUB_OUTPUT"
          fi

      - name: Mask database connection details
        working-directory: .
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python3 - <<'PY'
          import os, urllib.parse
          u = urllib.parse.urlsplit(os.environ.get("DATABASE_URL", ""))
          for v in {u.hostname, u.username, u.password}:
              if v:
                  print(f"::add-mask::{v}")
                  print(f"::add-mask::{urllib.parse.unquote(v)}")
          PY
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Install
        run: pip install --only-binary ':all:' --require-hashes -r requirements-run.txt

      - name: Run pipeline (${{ steps.clock.outputs.mode }})
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          VULNCHECK_API_TOKEN: ${{ secrets.VULNCHECK_API_TOKEN }}
          # Shadowserver reads its public dashboard endpoint and needs no credentials.
          # It self-limits to one fetch per day even though this workflow runs twice.
          MODE: ${{ steps.clock.outputs.mode }}
          SOURCES: ${{ github.event.inputs.sources }}
        run: |
          python -m zdc_obs.run \
            --mode "$MODE" \
            --trigger "$GITHUB_EVENT_NAME" \
            ${SOURCES:+--sources "$SOURCES"} \
            --report obs-report.json

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: obs-eval-report-${{ github.run_id }}
          path: pipeline/obs-report.json
          retention-days: 14

      - name: Summarise
        if: always()
        env:
          MODE: ${{ steps.clock.outputs.mode }}
        run: |
          {
            echo "### Observation pipeline — $MODE"
            echo
            if [ -f obs-report.json ]; then
              python - <<'PY'
          import json
          r = json.load(open("obs-report.json"))
          print(f"**Result:** {'OK' if r['ok'] else 'BLOCKED'} — {r['observations']} observations\n")
          print("| source | observations | complete | error |")
          print("|---|---:|---|---|")
          for name, s in sorted(r["per_source"].items()):
              print(f"| {name} | {s['observations']} | {s['complete_snapshot']} | {s['error'] or '—'} |")
          print("\n| check | severity | passed | summary |")
          print("|---|---|---|---|")
          for c in r["checks"]:
              print(f"| {c['name']} | {c['severity']} | {'yes' if c['passed'] else 'NO'} | {c['summary']} |")
          PY
            else
              echo "No report produced — the run failed before evaluation."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
