[project]
name = "zdc-kev"
version = "0.1.0"
description = "Zero Day Clock v2 — KEV ingestion pipeline"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
zdc-kev = "zdc_kev.run:main"
zdc-enrich = "zdc_enrich.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# zdc_patch was missing here, so `pip install -e .` never exposed it and the
# scheduled patch harvest died on ModuleNotFoundError. It ran locally because the
# working directory supplies the folder; the editable install's import finder only
# offers what this list names, which is why CI and a laptop disagreed.
packages = ["zdc_kev", "zdc_obs", "zdc_cve", "zdc_enrich", "zdc_honeypot", "zdc_crowdsec", "zdc_patch", "zdc_export"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "db: requires a live Postgres via DATABASE_URL",
    "network: hits real external APIs; excluded from CI by default",
]
