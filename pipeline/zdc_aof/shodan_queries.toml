# Shodan search rules for internet-exposed consoles of agentic offensive frameworks.
#
# THIS FILE IS THE CONFIG: edit it to add, change or retire a rule. Nothing else needs to change.
# Every run stores the rules it used (aof_core.detection_rules, source 'shodan_config') and this
# file's hash (run notes), so a published number can be traced to the exact queries behind it.
#
# HOW A FRAMEWORK IS COUNTED. Shodan has no OR, so a framework is an ORDERED list of rules. Rule k
# is sent as  `match -exclude_1 ... -exclude_(k-1)`: each rule only counts what the earlier ones
# did not, and the parts are added up. `exclude` is the term later rules subtract; it defaults to
# `match`. It differs when `match` carries a refinement that must not be part of the subtraction
# (see cyberstrikeai: the title rule drops honeypots, later rules must still skip the whole title).
# A rule with  exclude = false  cannot be negated (free text) and so MUST be the last one.
#
# `slug` is offensive.agency's slug for the same framework, so the two sources line up.
# `anchor = true` marks the rule the run checks is not zero: if Shodan stops answering for the
# best-known product label, the queries or the plan changed, not the internet.
#
# Each rule was measured on 2026-11-25 (docs/decisions/0011-agentic-c2.md lists what each one adds
# and the candidates that were rejected: header, server and most page-structure hashes match tens
# of thousands of unrelated sites).

window_days = 7          # "active" = seen in the last 7 days, the same window offensive.agency uses
min_interval_seconds = 1.1

[[framework]]
slug = "artex"
name = "ARTEX"
rules = [
  { match = 'product:ARTEX', anchor = true },
  { match = 'http.title:"自主渗透测试控制台"' },
  { match = 'http.title:"Autonomous Penetration Testing Console"' },
  { match = 'http.favicon.hash:-1898746557' },
  { match = 'http.favicon.hash:-1356779733' },
  { match = 'http.favicon.hash:-576220750' },
  { match = 'http.html:"Authorized operations console"' },
  { match = 'http.html:"LLM 驱动的自主渗透测试系统控制台"' },
  { match = 'http.html:"AI 驱动的自主渗透测试平台"' },
  { match = 'http.dom_hash:-2025233738' },
  { match = 'http.dom_hash:-747520487' },
  { match = 'http.dom_hash:241241215' },
  { match = 'http.dom_hash:97115985' },
  { match = 'http.title:"자율 침투 테스트 콘솔"' },
  { match = 'http.title:"Autonomous Security Control Node"' },
  { match = 'http.title:"自主安全检测控制台"' },
  # consoles behind a password prompt: free text, so it cannot be negated and goes last
  { match = '"realm=\"ARTEX\""', exclude = false },
]

[[framework]]
slug = "cyberstrikeai"
name = "CyberStrikeAI"
rules = [
  { match = 'product:CyberStrikeAI' },
  # about half of the pages titled CyberStrikeAI are tagged as honeypots by Shodan
  { match = 'http.title:"CyberStrikeAI" -tag:honeypot', exclude = 'http.title:"CyberStrikeAI"' },
  { match = 'http.html:"brand-wordmark__core"' },
  { match = 'http.html:"cyberstrike-theme"' },
  { match = 'http.headers_hash:1988570408' },
]

[[framework]]
slug = "pentagi"
